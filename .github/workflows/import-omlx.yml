name: Import oMLX and publish gateway
on:
  push:
    branches: [master]
    paths: ['.github/workflows/import-omlx.yml', '.bootstrap/**']
permissions:
  contents: write
concurrency:
  group: initial-omlx-import
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway-test-only
          POSTGRES_DB: gateway
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gateway"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GATEWAY_TEST_DSN: postgresql://gateway:gateway-test-only@localhost:5432/gateway
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import the verified upstream baseline and prepared commits
        shell: bash
        run: |
          set -euo pipefail
          patch_dir="$(mktemp -d)"
          cp .bootstrap/*.patch "$patch_dir/"
          cp .github/workflows/import-omlx.yml "$patch_dir/import-omlx.yml"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/jundot/omlx.git
          git fetch upstream main
          base=14194fe74bab38b89c144bd89656fbedca641d14
          git cat-file -e "$base^{commit}"
          git switch -c gateway/control-plane "$base"
          git am "$patch_dir/"*.patch
          git merge -s ours --allow-unrelated-histories origin/master -m 'Preserve repository initialization alongside upstream history'
          git rm -r .github/workflows
          mkdir -p .github/workflows
          cp "$patch_dir/import-omlx.yml" .github/workflows/import-omlx.yml
          git add .github/workflows/import-omlx.yml
          git commit -m 'Leave inherited automation disabled during downstream initialization'
      - name: Install control-plane test dependencies
        run: pip install fastapi httpx asyncpg pytest pytest-asyncio ruff
      - name: Validate control plane and real PostgreSQL transactions
        run: |
          python -m ruff check omlx/gateway omlx/scheduling.py tests/gateway
          python -m pytest tests/gateway --confcutdir=tests/gateway -q
      - name: Publish implementation without force
        run: |
          git push origin HEAD:refs/heads/master
